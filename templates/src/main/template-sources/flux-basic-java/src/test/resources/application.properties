# Stable local tenant values for the in-process IDP from io.fluxzero.idp:test-support.
# Keeping them in the generated project avoids classpath resource-order differences between build tools.
fluxzero.auth.external-base-url=http://localhost:8080
fluxzero.auth.oidc.issuer=http://localhost:8080
fluxzero.auth.oidc.client-id=local-auth-app
fluxzero.auth.oidc.redirect-uri=http://localhost:8080/app/callback
fluxzero.auth.oidc.resource-audience=http://localhost:8080/api
fluxzero.auth.oidc.scope=openid profile email
fluxzero.auth.oidc.login-state-secret=local-test-support-login-state-secret
fluxzero.auth.oidc.token-endpoint-auth-method=none
