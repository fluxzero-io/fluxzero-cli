name: PR

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      windows-package-changed: ${{ steps.changes.outputs.windows-package }}
    env:
      CANDIDATE_VERSION: 0.0.0-pr-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Windows package changes
        id: changes
        shell: bash
        run: |
          if git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}" | grep -Eq \
              '^(\.github/workflows/(native-build|release)\.yml|scripts/(collect-windows-runtime\.ps1|install\.ps1\.template))$'; then
            echo "windows-package=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows-package=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup tools from .tool-versions
        uses: jdx/mise-action@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build :cli:shadowJar :cli:generateScripts -PappVersion="$CANDIDATE_VERSION"

      - name: Publish candidate plugins locally
        run: >-
          ./gradlew :maven-plugin:publishToMavenLocal :gradle-plugin:publishToMavenLocal
          -PappVersion="$CANDIDATE_VERSION"
          -Dmaven.repo.local="$RUNNER_TEMP/fluxzero-plugin-repository"

      - name: Verify embedded templates with candidate plugins
        run: >-
          scripts/verify-embedded-templates.sh
          "cli/build/libs/fluxzero-cli-$CANDIDATE_VERSION.jar"
          "$RUNNER_TEMP/fluxzero-plugin-repository"

      - name: Test release versioning
        run: scripts/test-determine-release-version.sh

      - name: Test Central publication decisions
        run: scripts/test-central-publish-decision.sh

      - name: Test Homebrew formula generation
        run: scripts/test-render-homebrew-formula.sh

      - name: Test WinGet fork synchronization
        run: scripts/test-sync-winget-fork.sh

      - name: Test WinGet runtime dependency validation
        run: scripts/test-verify-winget-runtime-dependency.sh

      - name: Test macOS DMG detach recovery
        run: scripts/test-package-dmg-detach.sh

      - name: Upload candidate JAR and install scripts
        if: steps.changes.outputs.windows-package == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: jar-artifact
          path: |
            cli/build/libs/fluxzero-cli-${{ env.CANDIDATE_VERSION }}.jar
            cli/build/release-scripts/

  windows-package:
    needs: build-and-test
    if: needs.build-and-test.outputs.windows-package-changed == 'true'
    uses: ./.github/workflows/native-build.yml
    with:
      jar-name: fluxzero-cli-0.0.0-pr-${{ github.run_id }}.jar
      targets-json: >-
        {"include":[{"os":"windows-amd64","runner":"windows-2022","artifact-name":"flux-windows-amd64"}]}
