name: Native Image Build

on:
  workflow_call:
    inputs:
      jar-name:
        description: 'JAR filename to use for native build'
        required: false
        type: string
        default: 'fluxzero-cli-dev.jar'
      targets-json:
        description: 'JSON matrix for native build targets'
        required: false
        type: string
        default: >-
          {"include":[{"os":"linux-amd64","runner":"ubuntu-latest","artifact-name":"flux-linux-amd64"},{"os":"macos-amd64","runner":"macos-15-intel","artifact-name":"flux-macos-amd64"},{"os":"macos-arm64","runner":"macos-14","artifact-name":"flux-macos-arm64"},{"os":"windows-amd64","runner":"windows-2022","artifact-name":"flux-windows-amd64"}]}
jobs:
  native-build:
    name: Build Native Image - ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.targets-json) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download JAR artifact
        uses: actions/download-artifact@v7
        with:
          name: jar-artifact
          path: build/

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          # Use Java 21 LTS for native builds: JLine's native terminal code
          # segfaults under GraalVM + Java 25 due to restricted method enforcement.
          # Development can use Java 25 via .tool-versions; only native images need 21.
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        timeout-minutes: 15
        shell: bash
        run: |
          echo "Building ${{ matrix.os }} native image"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "Host: $(uname -m), CPU cores: $(sysctl -n hw.ncpu)"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "Host: Windows, CPU cores: $NUMBER_OF_PROCESSORS"
            systeminfo | findstr "Total Physical Memory"
          else
            echo "Host: $(uname -m), CPU cores: $(nproc), Memory: $(free -h | head -2)"
          fi
          CLI_JAR="build/cli/build/libs/${{ inputs.jar-name }}"
          OUTPUT_DIRECTORY="cli/build/native/nativeCompile"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            NATIVE_IMAGE="$(cygpath -u "$JAVA_HOME")/bin/native-image.cmd"
          else
            NATIVE_IMAGE="$JAVA_HOME/bin/native-image"
          fi
          mkdir -p "$OUTPUT_DIRECTORY"
          "$NATIVE_IMAGE" \
            --no-fallback \
            --install-exit-handlers \
            --enable-url-protocols=https \
            --enable-native-access=ALL-UNNAMED \
            --report-unsupported-elements-at-runtime \
            --initialize-at-build-time=kotlin \
            --initialize-at-run-time=org.jline \
            -H:+AddAllCharsets \
            -jar "$CLI_JAR" \
            "$OUTPUT_DIRECTORY/flux"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test -f "$OUTPUT_DIRECTORY/flux.exe"
          else
            test -x "$OUTPUT_DIRECTORY/flux"
          fi

      - name: Bundle Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/collect-windows-runtime.ps1 `
            -Executable cli/build/native/nativeCompile/flux.exe `
            -Destination cli/build/native/nativeCompile

      - name: Package Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:RUNNER_TEMP "fluxzero-windows-package"
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item cli/build/native/nativeCompile/flux.exe (Join-Path $packageDirectory "fz.exe")
          Copy-Item cli/build/native/nativeCompile/*.dll $packageDirectory
          Compress-Archive `
            -Path "$packageDirectory/*" `
            -DestinationPath cli/build/native/nativeCompile/flux-windows-amd64.zip `
            -Force

      - name: Set up dev server Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify native image
        shell: bash
        run: |
          echo "Testing native executable..."
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./cli/build/native/nativeCompile/flux.exe version
            ./cli/build/native/nativeCompile/flux.exe templates list
          else
            ./cli/build/native/nativeCompile/flux version
            ./cli/build/native/nativeCompile/flux templates list
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            archs="$(lipo -archs ./cli/build/native/nativeCompile/flux)"
            echo "Native executable architectures: $archs"
            case "${{ matrix.os }}" in
              macos-amd64)
                if [[ "$archs" != "x86_64" ]]; then
                  echo "ERROR: macos-amd64 artifact must be x86_64, got: $archs"
                  exit 1
                fi
                ;;
              macos-arm64)
                if [[ "$archs" != "arm64" ]]; then
                  echo "ERROR: macos-arm64 artifact must be arm64, got: $archs"
                  exit 1
                fi
                ;;
            esac
          fi
          echo "Native image verification successful!"

      - name: Integration test - Generate example project
        shell: bash
        run: |
          echo "Running integration test - generating example project..."
          
          # Create test directory and navigate to it
          mkdir -p test-workspace
          cd test-workspace
          
          # Run the CLI to generate an example project
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ../cli/build/native/nativeCompile/flux.exe init --template=flux-basic-java --name=example-project --package=com.example.project --group-id=com.example --artifact-id=example-project --description="Example project for CI testing" --build=maven --git
          else
            ../cli/build/native/nativeCompile/flux init --template=flux-basic-java --name=example-project --package=com.example.project --group-id=com.example --artifact-id=example-project --description="Example project for CI testing" --build=maven --git
          fi
          
          # Verify the project was created
          if [ ! -d "example-project" ]; then
            echo "ERROR: example-project directory was not created!"
            exit 1
          fi
          
          # Check for key files that should exist in a Java project
          cd example-project
          if [ ! -f "pom.xml" ]; then
            echo "ERROR: pom.xml not found!"
            exit 1
          fi
          
          if [ ! -d "src/main/java" ]; then
            echo "ERROR: src/main/java directory not found!"
            exit 1
          fi
          
          # Verify git repository was initialized
          if [ ! -d ".git" ]; then
            echo "ERROR: Git repository was not initialized!"
            exit 1
          fi

          # Verify retained hidden project metadata is included.
          for hidden_dir in .run; do
            if [ ! -d "$hidden_dir" ]; then
              echo "ERROR: Hidden directory '$hidden_dir' not found! Template packaging may have stripped dotfiles."
              exit 1
            fi
          done

          if [ ! -f ".gitignore" ]; then
            echo "ERROR: .gitignore not found! Template packaging may have stripped dotfiles."
            exit 1
          fi

          # List the generated structure for debugging
          echo "Generated project structure:"
          find . -type f | head -20

          echo "Integration test successful - example project generated correctly!"

      - name: Integration test - Dev environment lifecycle
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            CLI="$(pwd)/cli/build/native/nativeCompile/flux.exe"
          else
            CLI="$(pwd)/cli/build/native/nativeCompile/flux"
          fi
          mkdir -p dev-smoke
          printf '<project><modelVersion>4.0.0</modelVersion><groupId>test</groupId><artifactId>dev-smoke</artifactId><version>1</version></project>\n' > dev-smoke/pom.xml
          cleanup_dev_smoke() {
            status=$?
            trap - EXIT
            if [[ $status -ne 0 ]]; then
              echo "Dev environment lifecycle failed; bootstrap diagnostics follow."
              cat dev-smoke/.fluxzero/dev/bootstrap.log 2>/dev/null || true
              cat dev-smoke/.fluxzero/dev/diagnostics.json 2>/dev/null || true
            fi
            "$CLI" dev stop --project-dir dev-smoke --force >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup_dev_smoke EXIT
          "$CLI" dev --project-dir dev-smoke --background --no-compile-on-start --no-tests --no-frontend
          "$CLI" dev status --project-dir dev-smoke
          before_session="$(sed -nE 's/.*"sessionId"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' \
            dev-smoke/.fluxzero/dev/session.json | head -1)"
          test -n "$before_session"
          "$CLI" dev restart --project-dir dev-smoke --no-compile-on-start --no-tests --no-frontend
          "$CLI" dev status --project-dir dev-smoke
          after_session="$(sed -nE 's/.*"sessionId"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' \
            dev-smoke/.fluxzero/dev/session.json | head -1)"
          test -n "$after_session"
          if [[ "$before_session" == "$after_session" ]]; then
            echo "ERROR: fz dev restart did not replace the dev session"
            exit 1
          fi
          "$CLI" dev stop --project-dir dev-smoke --force
          trap - EXIT

      - name: Integration test - Concurrent greenfield MCP clients
        if: matrix.os == 'macos-arm64'
        shell: bash
        env:
          FLUXZERO_CLI_E2E_EXECUTABLE: ${{ github.workspace }}/cli/build/native/nativeCompile/flux
          FLUXZERO_MCP_E2E_DEV_SERVER_JAR: ${{ runner.temp }}/fluxzero-dev-server-standalone.jar
        run: |
          scripts/download-latest-dev-server.sh "$FLUXZERO_MCP_E2E_DEV_SERVER_JAR"
          ./gradlew :cli:greenfieldMcpConcurrencyE2e

      - name: Test installation script
        shell: bash
        run: |
          echo "Testing installation script with native binary..."
          
          # Create a test home directory to avoid conflicts
          TEST_HOME=$(mktemp -d)
          export HOME=$TEST_HOME
          
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Test PowerShell script
            PACKAGE_PATH="$(pwd)/cli/build/native/nativeCompile/flux-windows-amd64.zip"
            INSTALL_SCRIPT="$(pwd)/build/cli/build/release-scripts/install.ps1"
            
            echo "Testing PowerShell installation script..."
            pwsh -File "$INSTALL_SCRIPT" -Binary "$PACKAGE_PATH" -InstallPath
            
            # Debug: List what was actually installed
            echo "Contents of $TEST_HOME/.fluxzero/bin/:"
            ls -la "$TEST_HOME/.fluxzero/bin/" || echo "Directory does not exist"
            
            # Verify installation
            if [ ! -f "$TEST_HOME/.fluxzero/bin/fz.exe" ]; then
              echo "ERROR: fz.exe was not installed correctly!"
              exit 1
            fi
            if [ ! -f "$TEST_HOME/.fluxzero/bin/fluxzero.exe" ]; then
              echo "ERROR: fluxzero.exe alias was not installed correctly!"
              exit 1
            fi
            if ! compgen -G "$TEST_HOME/.fluxzero/bin/*.dll" >/dev/null; then
              echo "ERROR: Visual C++ runtime libraries were not installed!"
              exit 1
            fi
            
            # Test the installed binary
            "$TEST_HOME/.fluxzero/bin/fz.exe" version
            if [ $? -ne 0 ]; then
              echo "ERROR: Installed flux.exe failed to run!"
              exit 1
            fi
            "$TEST_HOME/.fluxzero/bin/fluxzero.exe" version
            
          else
            # Test bash script
            BINARY_PATH="$(pwd)/cli/build/native/nativeCompile/flux"
            INSTALL_SCRIPT="$(pwd)/build/cli/build/release-scripts/install.sh"
            
            echo "Testing bash installation script..."
            bash "$INSTALL_SCRIPT" --binary="$BINARY_PATH" --install-path
            
            # Verify installation
            if [ ! -f "$TEST_HOME/.fluxzero/bin/fz" ]; then
              echo "ERROR: fz was not installed correctly!"
              exit 1
            fi
            if [ ! -x "$TEST_HOME/.fluxzero/bin/fluxzero" ]; then
              echo "ERROR: fluxzero alias was not installed correctly!"
              exit 1
            fi
            
            # Test the installed binary
            "$TEST_HOME/.fluxzero/bin/fz" version
            if [ $? -ne 0 ]; then
              echo "ERROR: Installed flux failed to run!"
              exit 1
            fi
            "$TEST_HOME/.fluxzero/bin/fluxzero" version
            
            # Test the PATH installation (fz command)
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              # On Linux, test that fz was created and works
              if [ -x "/usr/local/bin/fz" ]; then
                /usr/local/bin/fz version
                if [ $? -ne 0 ]; then
                  echo "ERROR: fz command failed to run!"
                  exit 1
                fi
              else
                echo "WARNING: /usr/local/bin/fz was not created (permissions issue expected in CI)"
              fi
              if [ -x "/usr/local/bin/fluxzero" ]; then
                /usr/local/bin/fluxzero version
              else
                echo "WARNING: /usr/local/bin/fluxzero was not created (permissions issue expected in CI)"
              fi
            fi
          fi
          
          echo "Installation script test successful!"

      - name: Test uninstall script
        shell: bash
        run: |
          echo "Testing uninstall script..."
          
          # Create a test home directory and install first
          TEST_HOME=$(mktemp -d)
          export HOME=$TEST_HOME
          
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Test PowerShell scripts
            PACKAGE_PATH="$(pwd)/cli/build/native/nativeCompile/flux-windows-amd64.zip"
            INSTALL_SCRIPT="$(pwd)/build/cli/build/release-scripts/install.ps1"
            UNINSTALL_SCRIPT="$(pwd)/build/cli/build/release-scripts/uninstall.ps1"
            
            echo "Installing first..."
            pwsh -File "$INSTALL_SCRIPT" -Binary "$PACKAGE_PATH" -InstallPath
            
            # Verify installation exists
            if [ ! -f "$TEST_HOME/.fluxzero/bin/fz.exe" ]; then
              echo "ERROR: Installation failed - cannot test uninstall!"
              exit 1
            fi
            
            echo "Testing PowerShell uninstall script..."
            pwsh -File "$UNINSTALL_SCRIPT" -Force
            
            # Verify everything was removed
            if [ -d "$TEST_HOME/.fluxzero" ]; then
              echo "ERROR: Uninstall script failed to remove .fluxzero directory!"
              exit 1
            fi
            
          else
            # Test bash scripts
            BINARY_PATH="$(pwd)/cli/build/native/nativeCompile/flux"
            INSTALL_SCRIPT="$(pwd)/build/cli/build/release-scripts/install.sh"
            UNINSTALL_SCRIPT="$(pwd)/build/cli/build/release-scripts/uninstall.sh"
            
            echo "Installing first..."
            bash "$INSTALL_SCRIPT" --binary="$BINARY_PATH" --install-path
            
            # Verify installation exists
            if [ ! -f "$TEST_HOME/.fluxzero/bin/fz" ]; then
              echo "ERROR: Installation failed - cannot test uninstall!"
              exit 1
            fi
            
            echo "Testing bash uninstall script..."
            bash "$UNINSTALL_SCRIPT" --force
            
            # Verify everything was removed
            if [ -d "$TEST_HOME/.fluxzero" ]; then
              echo "ERROR: Uninstall script failed to remove .fluxzero directory!"
              exit 1
            fi
            
            # Check if system link was removed (on Linux)
            if [[ "$RUNNER_OS" == "Linux" ]] && [ -f "/usr/local/bin/fz" ]; then
              echo "ERROR: Uninstall script failed to remove /usr/local/bin/fz!"
              exit 1
            fi
            if [[ "$RUNNER_OS" == "Linux" ]] && [ -f "/usr/local/bin/fluxzero" ]; then
              echo "ERROR: Uninstall script failed to remove /usr/local/bin/fluxzero!"
              exit 1
            fi
          fi
          
          echo "Uninstall script test successful!"
          
          # Cleanup
          rm -rf "$TEST_HOME"
          if [[ "$RUNNER_OS" == "Linux" ]] && [ -f "/usr/local/bin/fz" ]; then
            sudo rm -f /usr/local/bin/fz || true
          fi
          if [[ "$RUNNER_OS" == "Linux" ]] && [ -f "/usr/local/bin/fluxzero" ]; then
            sudo rm -f /usr/local/bin/fluxzero || true
          fi

      - name: Upload native executable
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ./cli/build/native/nativeCompile/flux
          retention-days: 30

      - name: Upload Windows executable and runtime
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ./cli/build/native/nativeCompile/flux.exe
            ./cli/build/native/nativeCompile/*.dll
            ./cli/build/native/nativeCompile/flux-windows-amd64.zip
          retention-days: 30
