name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git fetch --tags --force
          scripts/determine-release-version.sh "$EVENT_NAME" "$RUN_ID" >> "$GITHUB_OUTPUT"

  build-and-test:
    runs-on: ubuntu-latest
    needs: version
    outputs:
      jar-name: fluxzero-cli-${{ needs.version.outputs.version }}.jar
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup tools from .tool-versions
        uses: jdx/mise-action@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build :cli:shadowJar :cli:generateScripts -PappVersion=${{ needs.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test JAR functionality
        env:
          CLI_JAR: cli/build/libs/fluxzero-cli-${{ needs.version.outputs.version }}.jar
          API_JAR: api/build/libs/flux-api-${{ needs.version.outputs.version }}.jar
        run: |
          echo "Testing CLI JAR with basic commands..."
          java -jar "$CLI_JAR" version
          java -jar "$CLI_JAR" templates list
          echo "CLI JAR functionality test successful!"
          
          echo "Testing API JAR startup..."
          # Test that API JAR can start and respond to health check
          # Positional parameters expand in the nested bash process.
          # shellcheck disable=SC2016
          timeout 30s bash -c '
            java -jar "$1" &
            API_PID=$!
            until curl -fsS http://localhost:8080/api/health; do sleep 0.5; done
            echo "API health check successful!"
            kill $API_PID 2>/dev/null || true
          ' _ "$API_JAR" || {
            echo "API JAR test failed!"
            exit 1
          }
          echo "API JAR functionality test successful!"

      - name: Publish candidate plugins locally
        run: >-
          ./gradlew :maven-plugin:publishToMavenLocal :gradle-plugin:publishToMavenLocal
          -PappVersion="${{ needs.version.outputs.version }}"
          -Dmaven.repo.local="$RUNNER_TEMP/fluxzero-plugin-repository"

      - name: Verify embedded templates with candidate plugins
        run: >-
          scripts/verify-embedded-templates.sh
          "cli/build/libs/fluxzero-cli-${{ needs.version.outputs.version }}.jar"
          "$RUNNER_TEMP/fluxzero-plugin-repository"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: jar-artifact
          path: |
            cli/build/libs/fluxzero-cli-${{ needs.version.outputs.version }}.jar
            api/build/libs/flux-api-${{ needs.version.outputs.version }}.jar
            cli/build/release-scripts/

  publish-plugins:
    runs-on: ubuntu-latest
    needs: [version, build-and-test, native-build-macos, native-build-cli, reserve-version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup tools from .tool-versions
        uses: jdx/mise-action@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Publish to Maven Central
        id: publish
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          base="https://repo.maven.apache.org/maven2/io/fluxzero/tools"
          maven_pom="$base/fluxzero-maven-plugin/$version/fluxzero-maven-plugin-$version.pom"
          gradle_pom="$base/fluxzero-gradle-plugin/$version/fluxzero-gradle-plugin-$version.pom"
          marker_pom="$base/gradle/plugin/io.fluxzero.tools.gradle.plugin.gradle.plugin/$version/io.fluxzero.tools.gradle.plugin.gradle.plugin-$version.pom"
          existing=0
          curl -fsS "$maven_pom" >/dev/null && existing=$((existing + 1)) || true
          curl -fsS "$gradle_pom" >/dev/null && existing=$((existing + 1)) || true
          curl -fsS "$marker_pom" >/dev/null && existing=$((existing + 1)) || true
          decision="$(scripts/central-publish-decision.sh \
            "$existing" \
            "${{ needs.reserve-version.outputs.created }}")"
          case "$decision" in
            complete)
              echo "Fluxzero plugins $version are already available from Maven Central."
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            wait)
              echo "Release $version was already reserved or this is a workflow rerun."
              echo "Skipping a duplicate Central upload and waiting for the accepted deployment."
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            publish)
              ./gradlew :maven-plugin:publishAndReleaseToMavenCentral \
                        :gradle-plugin:publishAndReleaseToMavenCentral \
                        -PappVersion="$version"
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            conflict)
              echo "Fluxzero plugin release $version was reserved by this run but is already partially present in Maven Central." >&2
              exit 1
              ;;
          esac
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.OSSRH_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.OSSRH_SIGNING_PASSPHRASE }}

      - name: Verify published plugins from clean clients
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          base="https://repo.maven.apache.org/maven2/io/fluxzero/tools"
          for attempt in $(seq 1 60); do
            if curl -fsS "$base/fluxzero-maven-plugin/$version/fluxzero-maven-plugin-$version.pom" >/dev/null \
               && curl -fsS "$base/fluxzero-gradle-plugin/$version/fluxzero-gradle-plugin-$version.pom" >/dev/null \
               && curl -fsS "$base/gradle/plugin/io.fluxzero.tools.gradle.plugin.gradle.plugin/$version/io.fluxzero.tools.gradle.plugin.gradle.plugin-$version.pom" >/dev/null; then
              break
            fi
            if [[ "$attempt" == "60" ]]; then
              echo "Plugins $version did not become available from Maven Central within 20 minutes." >&2
              echo "The version remains reserved. Rerunning this workflow will wait without uploading it again." >&2
              echo "If the Central deployment failed, start a new Release workflow to reserve the next version." >&2
              exit 1
            fi
            sleep 20
          done

          mkdir -p build/plugin-smoke/maven build/plugin-smoke/gradle
          printf '<project><modelVersion>4.0.0</modelVersion><groupId>test</groupId><artifactId>smoke</artifactId><version>1</version></project>\n' > build/plugin-smoke/maven/pom.xml
          mvn -q -Dmaven.repo.local="$RUNNER_TEMP/maven-smoke" \
            -f build/plugin-smoke/maven/pom.xml help:describe \
            -Dplugin="io.fluxzero.tools:fluxzero-maven-plugin:$version" -Ddetail
          printf 'plugins { id("io.fluxzero.tools.gradle.plugin") version "%s" }\n' "$version" > build/plugin-smoke/gradle/build.gradle.kts
          ./gradlew -g "$RUNNER_TEMP/gradle-smoke" -p build/plugin-smoke/gradle help --refresh-dependencies

  native-build-macos:
    needs: [version, build-and-test]
    uses: ./.github/workflows/native-build.yml
    with:
      jar-name: ${{ needs.build-and-test.outputs.jar-name }}
      targets-json: >-
        {"include":[{"os":"macos-amd64","runner":"macos-15-intel","artifact-name":"flux-macos-amd64"},{"os":"macos-arm64","runner":"macos-14","artifact-name":"flux-macos-arm64"}]}

  native-build-cli:
    needs: [version, build-and-test]
    uses: ./.github/workflows/native-build.yml
    with:
      jar-name: ${{ needs.build-and-test.outputs.jar-name }}
      targets-json: >-
        {"include":[{"os":"linux-amd64","runner":"ubuntu-latest","artifact-name":"flux-linux-amd64"},{"os":"windows-amd64","runner":"windows-2022","artifact-name":"flux-windows-amd64"}]}

  reserve-version:
    runs-on: ubuntu-latest
    needs: [version, build-and-test, native-build-macos, native-build-cli]
    permissions:
      contents: write
    outputs:
      created: ${{ steps.reserve.outputs.created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reserve release version
        id: reserve
        shell: bash
        run: |
          # The numeric tag is the durable release lock. Even if Central fails,
          # a later commit must use a new coordinate instead of uploading twice.
          version="${{ needs.version.outputs.version }}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$version")"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $version points to $tag_sha instead of $GITHUB_SHA." >&2
              exit 1
            fi
            echo "Release version $version was already reserved by this run."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" "$GITHUB_SHA" \
            -m "Fluxzero CLI $version" \
            -m "Release run: $GITHUB_RUN_ID"
          git push origin "refs/tags/$version"
          echo "Reserved release version $version."
          echo "created=true" >> "$GITHUB_OUTPUT"

  macos-launchpad-build:
    needs: [version, native-build-macos, reserve-version]
    uses: ./.github/workflows/macos-launchpad-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: [version, build-and-test, publish-plugins, native-build-macos, native-build-cli, reserve-version]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup tools from .tool-versions
        uses: jdx/mise-action@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v7
        with:
          name: jar-artifact
          path: build/

      - name: Rename files
        run: |
          mkdir -p build/libs
          mv build/cli/build/libs/${{ needs.build-and-test.outputs.jar-name }} build/libs/fluxzero-cli.jar
          mv build/api/build/libs/flux-api-${{ needs.version.outputs.version }}.jar build/libs/flux-api.jar
          
          # Copy release scripts to expected location
          cp -r build/cli/build/release-scripts build/

      - name: Verify JAR functionality
        run: |
          echo "Testing JAR with 'templates list' command..."
          if ! java -jar build/libs/fluxzero-cli.jar templates list; then
            echo "JAR verification failed!"
            exit 1
          fi
          echo "JAR verification successful!"

      - name: Download native artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: flux-*
          path: native-artifacts

      - name: Prepare native executables for release
        run: |
          mkdir -p build/native-releases
          cp native-artifacts/flux-linux-amd64/flux build/native-releases/flux-linux-amd64
          cp native-artifacts/flux-macos-amd64/flux build/native-releases/flux-macos-amd64
          cp native-artifacts/flux-macos-arm64/flux build/native-releases/flux-macos-arm64
          cp native-artifacts/flux-windows-amd64/flux.exe build/native-releases/flux-windows-amd64.exe
          chmod +x build/native-releases/flux-*
          mkdir -p build/winget
          cp build/native-releases/flux-windows-amd64.exe build/winget/fz.exe
          zip -j -9 build/native-releases/flux-windows-amd64.zip build/winget/fz.exe
          unzip -t build/native-releases/flux-windows-amd64.zip

      - name: Verify install scripts
        run: |
          echo "Testing install scripts with native binaries..."
          
          # Test bash install script with Linux binary
          echo "Testing bash install script..."
          TEST_HOME=$(mktemp -d)
          export TEST_HOME
          HOME=$TEST_HOME
          export HOME
          
          # Use Linux native binary for testing
          LINUX_BINARY="$(pwd)/build/native-releases/flux-linux-amd64"
          bash build/release-scripts/install.sh --install-path --binary="$LINUX_BINARY"
          
          # Check if the native binary was installed
          if [ ! -x "$TEST_HOME/.fluxzero/bin/fz" ]; then
            echo "Install script failed to install native binary!"
            exit 1
          fi
          if [ ! -x "$TEST_HOME/.fluxzero/bin/fluxzero" ]; then
            echo "Install script failed to install fluxzero alias!"
            exit 1
          fi
          
          # Test the installed CLI
          if ! "$TEST_HOME/.fluxzero/bin/fz" version; then
            echo "Installed native binary verification failed!"
            exit 1
          fi
          "$TEST_HOME/.fluxzero/bin/fluxzero" version
          
          # Check if fz was created in /usr/local/bin
          if [ ! -x "/usr/local/bin/fz" ]; then
            echo "Install script failed to create /usr/local/bin/fz!"
            exit 1
          fi
          if [ ! -x "/usr/local/bin/fluxzero" ]; then
            echo "Install script failed to create /usr/local/bin/fluxzero!"
            exit 1
          fi
          
          # Test the fz command directly
          if ! fz version; then
            echo "fz command verification failed!"
            exit 1
          fi
          
          # Also test templates list command via fz
          if ! fz templates list; then
            echo "fz templates list command failed!"
            exit 1
          fi
          fluxzero version
          
          echo "Bash install script verification successful!"
          
          # Test PowerShell install script syntax (we can't fully test on Linux)
          echo "Verifying PowerShell script syntax..."
          if command -v pwsh >/dev/null 2>&1; then
            # Just check PowerShell syntax without executing
            pwsh -Command "try { \$null = [System.Management.Automation.PSParser]::Tokenize((Get-Content 'build/release-scripts/install.ps1' -Raw), [ref]\$null) } catch { Write-Host \"PowerShell Syntax Error: \$(\$_.Exception.Message)\"; exit 1 }"
            echo "PowerShell script syntax verification successful!"
          else
            echo "PowerShell not available - skipping syntax check"
          fi
          
          echo "Install scripts verification successful!"
          
          # Cleanup
          sudo rm -f /usr/local/bin/fz /usr/local/bin/fluxzero
          rm -rf "$TEST_HOME"

      - name: Test uninstall scripts
        run: |
          echo "Testing uninstall scripts after installation..."
          
          # Test bash uninstall script with installed CLI
          echo "Testing bash uninstall script..."
          TEST_HOME=$(mktemp -d)
          export TEST_HOME
          HOME=$TEST_HOME
          export HOME
          
          # Install first using Linux binary
          LINUX_BINARY="$(pwd)/build/native-releases/flux-linux-amd64"
          bash build/release-scripts/install.sh --install-path --binary="$LINUX_BINARY"
          
          # Verify installation exists
          if [ ! -x "$TEST_HOME/.fluxzero/bin/fz" ]; then
            echo "ERROR: Installation failed - cannot test uninstall!"
            exit 1
          fi
          
          # Test uninstall
          bash build/release-scripts/uninstall.sh --force
          
          # Verify everything was removed
          if [ -d "$TEST_HOME/.fluxzero" ]; then
            echo "ERROR: Uninstall script failed to remove .fluxzero directory!"
            exit 1
          fi
          
          # Verify system link was removed
          if [ -f "/usr/local/bin/fz" ]; then
            echo "ERROR: Uninstall script failed to remove /usr/local/bin/fz!"
            exit 1
          fi
          if [ -f "/usr/local/bin/fluxzero" ]; then
            echo "ERROR: Uninstall script failed to remove /usr/local/bin/fluxzero!"
            exit 1
          fi
          
          echo "Bash uninstall script test successful!"
          
          # Test legacy installation cleanup
          echo "Testing legacy installation cleanup..."
          TEST_HOME2=$(mktemp -d)
          export TEST_HOME2
          HOME=$TEST_HOME2
          export HOME
          
          # Create a fake legacy installation
          mkdir -p "$TEST_HOME2/.flux"
          echo "fake jar content" > "$TEST_HOME2/.flux/fluxzero-cli.jar"
          
          # Run uninstall script
          bash build/release-scripts/uninstall.sh --force
          
          # Verify legacy directory was removed
          if [ -d "$TEST_HOME2/.flux" ]; then
            echo "ERROR: Uninstall script failed to remove legacy .flux directory!"
            exit 1
          fi
          
          echo "Legacy cleanup test successful!"
          
          # Test PowerShell uninstall script syntax
          echo "Testing PowerShell uninstall script syntax..."
          if command -v pwsh >/dev/null 2>&1; then
            # Just check PowerShell syntax without executing
            pwsh -Command "try { \$null = [System.Management.Automation.PSParser]::Tokenize((Get-Content 'build/release-scripts/uninstall.ps1' -Raw), [ref]\$null) } catch { Write-Host \"PowerShell Uninstall Syntax Error: \$(\$_.Exception.Message)\"; exit 1 }"
            echo "PowerShell uninstall script syntax verification successful!"
          else
            echo "PowerShell not available - skipping uninstall syntax check"
          fi
          
          echo "Uninstall scripts verification successful!"
          
          # Cleanup
          rm -rf "$TEST_HOME" "$TEST_HOME2"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: Release ${{ needs.version.outputs.version }}
          files: |
            build/libs/fluxzero-cli.jar
            build/libs/flux-api.jar
            build/release-scripts/install.sh
            build/release-scripts/install.ps1
            build/release-scripts/uninstall.sh
            build/release-scripts/uninstall.ps1
            build/native-releases/flux-linux-amd64
            build/native-releases/flux-macos-amd64
            build/native-releases/flux-macos-arm64
            build/native-releases/flux-windows-amd64.exe
            build/native-releases/flux-windows-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-package-managers:
    needs: [version, release]
    uses: ./.github/workflows/publish-package-managers.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
